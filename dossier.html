<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/SourceSans3VF-Upright.otf.woff2") format("woff2-variations"); font-weight: 200 900; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  :root {
    --navy: var(--vb-navy); --navy-2: var(--vb-navy-raised);
    --ivory: var(--vb-ground-alt); --paper: var(--vb-white);
    --gold: var(--vb-gold); --gold-ink: var(--vb-gold-dim);
    --border: var(--vb-line-warm); --ink: var(--vb-ink-900); --ink-2: #3A4654; --muted: var(--vb-ink-500);
    --sans: var(--vb-font-body); --mono: var(--vb-font-mono);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--ivory); }
  button { font: inherit; color: inherit; }
  a { color: var(--navy); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Header, as on the platform ---------- */
  .demobar { background: var(--paper); color: var(--gold-ink); font: 500 11.5px/1.5 var(--mono); letter-spacing: 0.06em; text-align: center; padding: 5px 24px; border-bottom: 1px solid var(--border); }
  .site-header { background: var(--navy); color: var(--paper); }
  .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: stretch; justify-content: space-between; gap: 24px; }
  .wordmark { display: flex; align-items: center; font-size: 19px; letter-spacing: 0.02em; padding: 18px 0; background: none; border: 0; text-decoration: none; }
  .wordmark .v { color: var(--paper); } .wordmark .b { color: var(--gold); }
  .primary-nav { margin-right: auto; }
  .primary-nav ul { list-style: none; margin: 0; padding: 0; display: flex; height: 100%; }
  .primary-nav button { height: 100%; background: none; border: 0; padding: 0 18px; color: #C9D1DA; font-size: 14px; border-bottom: 2px solid transparent; border-top: 2px solid transparent; }
  .primary-nav button[aria-current="page"] { color: var(--paper); border-bottom-color: var(--gold); }
  .header-side { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .header-side label { color: #C9D1DA; }
  .co { font: inherit; font-size: 13.5px; background: var(--navy-2); color: var(--paper); border: 1px solid #3B5068; padding: 6px 10px; border-radius: 2px; }
  .back-link { color: #C9D1DA; text-decoration: none; white-space: nowrap; } .back-link:hover { color: var(--paper); }

  /* ---------- Page ---------- */
  main { max-width: 1280px; margin: 0 auto; padding: 32px 32px 72px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; align-items: start; }
  main > * { min-width: 0; }   /* wide tables scroll inside their own box instead of widening the page */
  .title-band { grid-column: 1 / -1; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
  h1 { font-weight: 300; font-size: 34px; line-height: 1.15; color: var(--navy); margin: 0 0 10px; }
  h2 { font-weight: 300; font-size: 23px; line-height: 1.25; color: var(--navy); margin: 0 0 6px; }
  h3 { font-weight: 600; font-size: 14px; color: var(--navy); margin: 0 0 6px; }
  .label { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; }
  .meta { color: var(--ink-2); font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }

  main > aside { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .topics a { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; text-decoration: none; color: var(--ink-2); border-left: 2px solid transparent; font-size: 13.5px; line-height: 1.35; }
  .topics a:hover { color: var(--navy); background: var(--paper); }
  .topics a[aria-current="true"] { border-left-color: var(--gold); color: var(--navy); background: var(--paper); font-weight: 600; }
  .topics .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tools { margin: 14px 0 0; padding: 0 10px; }
  .tools input[type=search] { width: 100%; font: inherit; font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--border); background: var(--paper); }
  .tools label { display: block; margin-top: 8px; color: var(--ink-2); }

  section.block { background: var(--paper); border: 1px solid var(--border); padding: 22px 24px 18px; margin-bottom: 26px; scroll-margin-top: 16px; }
  section.block .ask { margin: 0 0 16px; color: var(--ink-2); max-width: 70ch; }
  .fieldhead { margin: 18px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .fieldhead h3 { margin: 0; }
  .mfacts { margin: 0; padding: 0; list-style: none; } .mfacts li { padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; } .mfacts li:last-child { border: 0; }
  table.mt td { vertical-align: top; } table.mt td:first-child { white-space: nowrap; font-weight: 600; color: var(--navy); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-family: var(--sans); font-weight: 500; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--navy); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }
  .table-scroll table { min-width: 640px; }
  tr.calc td { background: #EFECE4; }
  td.src { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); min-width: 7em; }
  td.per { font-family: var(--mono); font-size: 11.5px; min-width: 6em; }
  td.per, td.src, td.st, td.view-cell { width: 1%; } td.src.web { min-width: 15em; }   /* these fit their content; the entry takes the rest */
  td.fld { color: var(--muted); width: 18%; }
  .chip { font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; color: var(--muted); }
  .chip.ok { color: #2F6B3A; } .chip.rep { color: var(--gold-ink); }
  .cell-btn { background: none; border: 0; padding: 0 2px; cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); border-bottom: 1px dotted var(--gold); border-radius: 0; }
  .cell-btn:hover { color: var(--navy); border-bottom-style: solid; }
  .cell-btn.on, tr.fact-on td { background: #F5EFDF; }
  .cell-btn sup { font-size: 9px; color: var(--muted); margin-left: 2px; }
  .view-btn { font-family: var(--sans); font-size: 12px; line-height: 1; padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px; background: var(--paper); color: var(--navy); cursor: pointer; white-space: nowrap; }
  .view-btn:hover { border-color: var(--navy); } a.view-btn { display: inline-block; text-decoration: none; }
  .view-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  td.view-cell { text-align: right; padding-top: 6px; padding-bottom: 6px; }
  tr[hidden] { display: none; }
  details summary { cursor: pointer; color: var(--gold-ink); font-size: 12.5px; margin: 6px 0; }
  .arith td:first-child { width: 22%; } .arith td:nth-child(2) { color: var(--muted); font-size: 12.5px; } .arith td.num.wrap { white-space: normal; width: 26%; }
  .fnote { font-size: 12px; line-height: 1.45; color: var(--muted); margin-top: 3px; }
  .fids { font-family: var(--mono); font-size: 11px; line-height: 1.7; } .fids a { color: var(--navy); text-decoration: none; border-bottom: 1px dotted var(--gold); } .fids a:hover { border-bottom-style: solid; }
  .mrows td:first-child { font-family: var(--mono); font-size: 11.5px; color: var(--gold-ink); white-space: nowrap; } .mrows td:nth-child(2) { width: 18%; } .mrows td:nth-child(4) { width: 26%; }
  .reqs { table-layout: fixed; } .reqs th:first-child { width: 8%; } .reqs th:nth-child(2) { width: 52%; } .reqs th:nth-child(3) { width: 16%; }
  tr:target td { background: #F5EFDF; }
  .assess { border: 1px dashed var(--gold); padding: 12px 14px; margin-top: 18px; color: var(--muted); }
  .assess textarea { display: block; width: 100%; margin: 4px 0 6px; font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--border); padding: 8px 10px; resize: vertical; }
  .assess .share { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; color: var(--ink-2); margin: 2px 0 6px; } .assess .share label { cursor: pointer; white-space: nowrap; }
  .assess textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  /* 26 Oct 2026: the investor's own limits; two states, filled or outlined, never a third */
  table.lims td { vertical-align: top; } table.lims td.limset { white-space: nowrap; } table.lims .limset .small { display: block; margin-top: 3px; font-weight: 400; }
  table.lims select, table.lims input { font: inherit; font-size: 13px; color: var(--ink); border: 1px solid var(--border); background: var(--paper); padding: 3px 6px; border-radius: 2px; } table.lims input { width: 72px; text-align: right; }
  .lim { display: block; font-size: 11.5px; margin-top: 2px; white-space: nowrap; color: var(--ink-2); } .lim::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; border: 1.5px solid var(--navy); background: var(--paper); }
  .lim.in { color: var(--navy); } .lim.in::before { background: var(--navy); } .lgnd .lim { display: inline; }
  /* ---------- overview: the investor's first screen; the fact proof is the second tab ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 16px; }
  .tabs button { background: var(--paper); border: 1px solid var(--border); padding: 8px 16px; font-size: 14px; color: var(--ink-2); cursor: pointer; border-radius: 2px; }
  .tabs button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 2px; text-align: left; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--border); padding: 12px 14px; border-radius: 0; }
  button.tile { cursor: pointer; } button.tile:hover { border-color: var(--gold); }
  .tile .v { font-size: 26px; font-weight: 300; line-height: 1.2; color: var(--navy); font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; line-height: 1.45; color: var(--muted); }
  a.differs { font-size: 11px; color: #9A3B2E; white-space: nowrap; }
  .chart .ref { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 5 4; } .chart .ref-text { font-size: 10.5px; fill: var(--gold-ink); }
  ul.ev, ul.log, ul.items { list-style: none; margin: 0; padding: 0; } ul.ev li { margin: 0 0 7px; line-height: 1.45; } ul.log li, ul.items li { margin: 0 0 5px; }
  ul.items li::before { content: "·"; color: var(--gold); margin-right: 8px; }
  .evk { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-ink); margin-right: 6px; white-space: nowrap; }
  .src-btn { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  td.nums { width: 30%; font-size: 13px; line-height: 1.6; }
  .cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 24px; font-size: 13px; color: var(--ink-2); }
  section.block h3 + ul { margin-top: 4px; } section.block ul + h3 { margin-top: 16px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; margin: 6px 0 18px; }
  .chart { background: var(--paper); border: 1px solid var(--border); padding: 16px 18px 10px; position: relative; }
  .chart.wide { grid-column: 1 / -1; }
  .chart h3 { margin-bottom: 2px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid line { stroke: #E4E3DF; stroke-width: 1; }
  .chart .zero { stroke: #9AA1A9; stroke-width: 1; }
  .chart .axis-text { font-family: var(--sans); font-size: 12.5px; font-variant-numeric: tabular-nums; fill: var(--muted); }
  .chart .val-text { font-size: 13.5px; fill: var(--ink); font-weight: 600; }
  .chart .bar { fill: var(--navy-2); } .chart .bar.latest { fill: var(--navy); } .chart .bar.plan { fill: #C9B987; }
  .chart .bar-group { cursor: pointer; } .chart .bar-group:hover .bar { fill: #2B4D72; } .chart .bar-group:hover .bar.plan { fill: var(--gold); }
  .kv td:first-child { width: 30%; color: var(--muted); }
  .pass { color: #2F6B3A; font-weight: 600; } .fail { color: #9A3B2E; font-weight: 600; } .check { color: var(--gold-ink); font-weight: 600; }

  /* ---------- Source viewer: split screen with the referenced page of the document ---------- */
  body.dv-open { padding-right: var(--dv-w, min(50vw, 820px)); }
  #doc-viewer { position: fixed; top: 0; right: 0; bottom: 0; width: var(--dv-w, min(50vw, 820px)); z-index: 60; display: flex; flex-direction: column; background: #E4E3DE; border-left: 1px solid var(--border); box-shadow: -10px 0 28px rgba(9, 30, 52, 0.10); }
  #doc-viewer[hidden] { display: none; }
  .dv-bar { background: var(--navy); color: var(--paper); padding: 14px 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .dv-bar > div { flex: 1; min-width: 0; } .dv-bar .dv-doc { width: 100%; text-overflow: ellipsis; } .dv-bar .dv-meta { overflow-wrap: anywhere; }   /* 23 Oct 2026: a long document title no longer pushes the close button off screen */
  .dv-bar .dv-kicker { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); margin: 0 0 4px; }
  .dv-bar .dv-title { font-size: 16px; font-weight: 300; margin: 0; }
  .dv-doc { font: inherit; font-size: 15px; font-weight: 300; background: transparent; color: var(--paper); border: 0; border-bottom: 1px solid #3B5068; padding: 2px 0; max-width: 100%; cursor: pointer; }
  .dv-doc option { color: var(--ink); background: var(--paper); }
  .dv-handle { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; }
  .dv-handle:hover, body.dv-resizing .dv-handle { background: rgba(179, 154, 87, 0.35); }
  body.dv-resizing { user-select: none; cursor: col-resize; }
  .dv-zoom { display: flex; align-items: center; gap: 4px; margin-right: 10px; }
  .dv-bar .dv-meta { font-family: var(--mono); font-size: 11.5px; color: #B9C3CE; margin: 4px 0 0; }
  .dv-close { flex: none; width: 36px; height: 36px; border: 1px solid #8A9BAE; border-radius: 3px; background: var(--navy-2); color: var(--paper); font-size: 22px; line-height: 1; cursor: pointer; }
  .dv-close:hover { background: var(--navy-2); border-color: var(--gold); }
  .dv-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 22px; background: var(--paper); border-bottom: 1px solid var(--border); font-size: 12px; }
  .dv-strip .lbl { color: var(--muted); margin-right: 4px; }
  .dv-pg { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 2px; background: none; color: var(--ink-2); cursor: pointer; }
  .dv-pg:hover { border-color: var(--navy); color: var(--navy); }
  .dv-pg[aria-current="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .dv-pages { flex: 1; overflow: auto; padding: 22px 26px 40px; position: relative; }
  .dv-loading { color: var(--muted); font-size: 13px; padding: 20px 0; }
  .pdfpage { position: relative; margin: 0 auto 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.10), 0 6px 18px rgba(9, 30, 52, 0.08); overflow: hidden; }
  .pdfpage canvas { display: block; width: 100%; height: 100%; }
  .pdfpage .pn { position: absolute; z-index: 2; right: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); background: rgba(255,255,255,0.8); padding: 1px 5px; border-radius: 2px; }
  .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; line-height: 1; text-size-adjust: none; forced-color-adjust: none; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer span.hl { background: rgba(179, 154, 87, 0.32); border-radius: 2px; cursor: pointer; }
  .textLayer span.hl:hover { background: rgba(179, 154, 87, 0.5); }
  .textLayer span.hl.on { background: rgba(242, 226, 174, 0.8); box-shadow: 0 0 0 2px var(--gold); }
  .dv-page { background: #FFFFFF; color: var(--ink); padding: 32px 40px 28px; min-height: 560px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.10), 0 6px 18px rgba(9, 30, 52, 0.08); }
  .dv-page .rh { display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 14px; }
  .dv-page .rf { margin-top: auto; padding-top: 24px; display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; color: var(--muted); }
  .dv-page .quote { border-left: 3px solid var(--gold); background: #FBF6E8; padding: 8px 12px; margin: 0 0 14px; font-size: 13px; }
  .dv-page .quote .lbl { display: block; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 3px; }
  .dv-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.65; color: var(--ink-2); }
  .dv-text mark { background: rgba(179, 154, 87, 0.22); color: inherit; padding: 1px 2px; border-radius: 2px; }
  .dv-text mark.on { background: #F2E2AE; color: var(--ink); box-shadow: 0 0 0 2px var(--gold); }
  .dv-text mark { cursor: pointer; } .dv-text mark:hover { outline: 1px solid var(--gold); }
  .dv-page + .dv-page, .dv-gap + .dv-page { margin-top: 18px; }
  .dv-gap { text-align: center; color: var(--muted); font-size: 11.5px; padding: 10px 0 2px; }
  .dv-strip b { font-family: var(--mono); } .dv-strip > span, .dv-strip > a { margin-right: 4px; }
  .dv-sec { color: var(--navy); font-size: 12px; } .dv-sec:hover { color: var(--gold-ink); }
  .dv-nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .dv-pg[disabled] { opacity: 0.4; cursor: default; }
  .dv-quote { flex-basis: 100%; font-size: 12.5px; color: var(--ink-2); border-left: 3px solid var(--gold); background: #FBF6E8; padding: 6px 10px; margin-top: 6px; }
  .dv-quote .lbl { display: block; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 2px; }
  body.embed .demobar, body.embed .site-header { display: none; }
  body.embed { background: transparent; }
  body.embed main { padding: 0 0 8px; gap: 28px; }
  body.embed .title-band .eyebrow, body.embed .title-band h1, body.embed .title-band .meta { display: none; }   /* the platform's page heading names the company */
  body.embed main > aside { position: relative; top: 0; max-height: none; }
  body.noaside main { grid-template-columns: minmax(0, 1fr); } body.noaside main > aside { display: none; }
  body.app main { gap: 20px; } body.app section.block { padding: 16px 20px 14px; margin-bottom: 16px; } body.app h2 { font-size: 18px; font-weight: 500; } body.app section.block .ask { font-size: 13px; color: var(--muted); margin-bottom: 12px; } body.app #tab-overview .eyebrow { display: none; }
  body.mode-viewer .demobar, body.mode-viewer .site-header, body.mode-viewer main { display: none; }
  body.mode-viewer { padding-right: 0 !important; }
  body.mode-viewer #doc-viewer { left: 0; width: 100%; border-left: 0; box-shadow: none; }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; padding: 24px 16px 56px; } main > aside { position: static; max-height: none; }
    body.mode-page #doc-viewer, body.mode-page .view-btn, body.mode-page .view-cell, body.mode-page th.view { display: none !important; } body.mode-page.dv-open { padding-right: 0; }
    .header-inner { flex-wrap: wrap; padding: 0 16px; } .header-side { flex: 1 0 100%; flex-wrap: wrap; padding: 8px 0 10px; } .co { min-width: 0; max-width: 100%; }
