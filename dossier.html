<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VanillaBonds — Fact dossier</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/tokens.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @font-face { font-family: "Source Sans 3"; src: url("assets/fonts/SourceSans3VF-Upright.otf.woff2") format("woff2-variations"); font-weight: 200 900; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  :root {
    --navy: var(--vb-navy); --navy-2: var(--vb-navy-raised);
    --ivory: var(--vb-ground-alt); --paper: var(--vb-white);
    --gold: var(--vb-gold); --gold-ink: var(--vb-gold-dim);
    --border: var(--vb-line-warm); --ink: var(--vb-ink-900); --ink-2: #3A4654; --muted: var(--vb-ink-500);
    --sans: var(--vb-font-body); --mono: var(--vb-font-mono);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--ivory); }
  button { font: inherit; color: inherit; }
  a { color: var(--navy); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Header, as on the platform ---------- */
  .demobar { background: var(--paper); color: var(--gold-ink); font: 500 11.5px/1.5 var(--mono); letter-spacing: 0.06em; text-align: center; padding: 5px 24px; border-bottom: 1px solid var(--border); }
  .site-header { background: var(--navy); color: var(--paper); }
  .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: stretch; justify-content: space-between; gap: 24px; }
  .wordmark { display: flex; align-items: center; font-size: 19px; letter-spacing: 0.02em; padding: 18px 0; background: none; border: 0; text-decoration: none; }
  .wordmark .v { color: var(--paper); } .wordmark .b { color: var(--gold); }
  .primary-nav { margin-right: auto; }
  .primary-nav ul { list-style: none; margin: 0; padding: 0; display: flex; height: 100%; }
  .primary-nav button { height: 100%; background: none; border: 0; padding: 0 18px; color: #C9D1DA; font-size: 14px; border-bottom: 2px solid transparent; border-top: 2px solid transparent; }
  .primary-nav button[aria-current="page"] { color: var(--paper); border-bottom-color: var(--gold); }
  .header-side { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .header-side label { color: #C9D1DA; }
  .co { font: inherit; font-size: 13.5px; background: var(--navy-2); color: var(--paper); border: 1px solid #3B5068; padding: 6px 10px; border-radius: 2px; }
  .back-link { color: #C9D1DA; text-decoration: none; white-space: nowrap; } .back-link:hover { color: var(--paper); }

  /* ---------- Page ---------- */
  main { max-width: 1280px; margin: 0 auto; padding: 32px 32px 72px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; align-items: start; }
  .title-band { grid-column: 1 / -1; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
  h1 { font-weight: 300; font-size: 34px; line-height: 1.15; color: var(--navy); margin: 0 0 10px; }
  h2 { font-weight: 300; font-size: 23px; line-height: 1.25; color: var(--navy); margin: 0 0 6px; }
  h3 { font-weight: 600; font-size: 14px; color: var(--navy); margin: 0 0 6px; }
  .label { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; }
  .meta { color: var(--ink-2); font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }

  main > aside { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .topics a { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; text-decoration: none; color: var(--ink-2); border-left: 2px solid transparent; font-size: 13.5px; line-height: 1.35; }
  .topics a:hover { color: var(--navy); background: var(--paper); }
  .topics a[aria-current="true"] { border-left-color: var(--gold); color: var(--navy); background: var(--paper); font-weight: 600; }
  .topics .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tools { margin: 14px 0 0; padding: 0 10px; }
  .tools input[type=search] { width: 100%; font: inherit; font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--border); background: var(--paper); }
  .tools label { display: block; margin-top: 8px; color: var(--ink-2); }

  section.block { background: var(--paper); border: 1px solid var(--border); padding: 22px 24px 18px; margin-bottom: 26px; scroll-margin-top: 16px; }
  section.block .ask { margin: 0 0 16px; color: var(--ink-2); max-width: 70ch; }
  .fieldhead { margin: 18px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .fieldhead h3 { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-family: var(--sans); font-weight: 500; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--navy); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }
  .table-scroll table { min-width: 640px; }
  tr.calc td { background: #EFECE4; }
  td.src { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  td.per { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  td.fld { color: var(--muted); width: 18%; }
  .chip { font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; color: var(--muted); }
  .chip.ok { color: #2F6B3A; } .chip.rep { color: var(--gold-ink); }
  .cell-btn { background: none; border: 0; padding: 0 2px; cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); border-bottom: 1px dotted var(--gold); border-radius: 0; }
  .cell-btn:hover { color: var(--navy); border-bottom-style: solid; }
  .cell-btn.on, tr.fact-on td { background: #F5EFDF; }
  .cell-btn sup { font-size: 9px; color: var(--muted); margin-left: 2px; }
  .view-btn { font-family: var(--sans); font-size: 12px; line-height: 1; padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px; background: var(--paper); color: var(--navy); cursor: pointer; white-space: nowrap; }
  .view-btn:hover { border-color: var(--navy); }
  .view-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  td.view-cell { text-align: right; padding-top: 6px; padding-bottom: 6px; }
  tr[hidden] { display: none; }
  details summary { cursor: pointer; color: var(--gold-ink); font-size: 12.5px; margin: 6px 0; }
  .arith td:first-child { width: 22%; } .arith td:nth-child(2) { color: var(--muted); font-size: 12.5px; }
  .assess { border: 1px dashed var(--gold); padding: 12px 14px; margin-top: 18px; min-height: 60px; color: var(--muted); font-style: italic; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin: 6px 0 18px; }
  .chart { background: var(--paper); border: 1px solid var(--border); padding: 16px 18px 10px; position: relative; }
  .chart.wide { grid-column: 1 / -1; }
  .chart h3 { margin-bottom: 2px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid line { stroke: #E4E3DF; stroke-width: 1; }
  .chart .zero { stroke: #9AA1A9; stroke-width: 1; }
  .chart .axis-text { font-family: var(--sans); font-size: 10.5px; font-variant-numeric: tabular-nums; fill: var(--muted); }
  .chart .val-text { font-size: 11.5px; fill: var(--ink); font-weight: 600; }
  .chart .bar { fill: var(--navy-2); } .chart .bar.latest { fill: var(--navy); } .chart .bar.plan { fill: #C9B987; }
  .chart .bar-group { cursor: pointer; } .chart .bar-group:hover .bar { fill: #2B4D72; } .chart .bar-group:hover .bar.plan { fill: var(--gold); }
  .kv td:first-child { width: 30%; color: var(--muted); }
  .pass { color: #2F6B3A; font-weight: 600; } .fail { color: #9A3B2E; font-weight: 600; } .check { color: var(--gold-ink); font-weight: 600; }

  /* ---------- Source viewer: split screen with the referenced page of the document ---------- */
  body.dv-open { padding-right: var(--dv-w, min(50vw, 820px)); }
  #doc-viewer { position: fixed; top: 0; right: 0; bottom: 0; width: var(--dv-w, min(50vw, 820px)); z-index: 60; display: flex; flex-direction: column; background: #E4E3DE; border-left: 1px solid var(--border); box-shadow: -10px 0 28px rgba(9, 30, 52, 0.10); }
  #doc-viewer[hidden] { display: none; }
  .dv-bar { background: var(--navy); color: var(--paper); padding: 14px 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .dv-bar .dv-kicker { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); margin: 0 0 4px; }
  .dv-bar .dv-title { font-size: 16px; font-weight: 300; margin: 0; }
  .dv-doc { font: inherit; font-size: 15px; font-weight: 300; background: transparent; color: var(--paper); border: 0; border-bottom: 1px solid #3B5068; padding: 2px 0; max-width: 100%; cursor: pointer; }
  .dv-doc option { color: var(--ink); background: var(--paper); }
  .dv-handle { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; }
  .dv-handle:hover, body.dv-resizing .dv-handle { background: rgba(179, 154, 87, 0.35); }
  body.dv-resizing { user-select: none; cursor: col-resize; }
  .dv-zoom { display: flex; align-items: center; gap: 4px; margin-right: 10px; }
  .dv-bar .dv-meta { font-family: var(--mono); font-size: 11.5px; color: #B9C3CE; margin: 4px 0 0; }
  .dv-close { flex: none; width: 34px; height: 34px; border: 1px solid #3B5068; border-radius: 2px; background: none; color: var(--paper); font-size: 20px; line-height: 1; cursor: pointer; }
  .dv-close:hover { background: var(--navy-2); border-color: var(--gold); }
  .dv-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 22px; background: var(--paper); border-bottom: 1px solid var(--border); font-size: 12px; }
  .dv-strip .lbl { color: var(--muted); margin-right: 4px; }
  .dv-pg { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 2px; background: none; color: var(--ink-2); cursor: pointer; }
  .dv-pg:hover { border-color: var(--navy); color: var(--navy); }
  .dv-pg[aria-current="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .dv-pages { flex: 1; overflow: auto; padding: 22px 26px 40px; position: relative; }
  .dv-loading { color: var(--muted); font-size: 13px; padding: 20px 0; }
  .pdfpage { position: relative; margin: 0 auto 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.10), 0 6px 18px rgba(9, 30, 52, 0.08); overflow: hidden; }
  .pdfpage canvas { display: block; width: 100%; height: 100%; }
  .pdfpage .pn { position: absolute; z-index: 2; right: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); background: rgba(255,255,255,0.8); padding: 1px 5px; border-radius: 2px; }
  .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; line-height: 1; text-size-adjust: none; forced-color-adjust: none; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer span.hl { background: rgba(179, 154, 87, 0.32); border-radius: 2px; cursor: pointer; }
  .textLayer span.hl:hover { background: rgba(179, 154, 87, 0.5); }
  .textLayer span.hl.on { background: rgba(242, 226, 174, 0.8); box-shadow: 0 0 0 2px var(--gold); }
  .dv-page { background: #FFFFFF; color: var(--ink); padding: 32px 40px 28px; min-height: 560px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.10), 0 6px 18px rgba(9, 30, 52, 0.08); }
  .dv-page .rh { display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 14px; }
  .dv-page .rf { margin-top: auto; padding-top: 24px; display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; color: var(--muted); }
  .dv-page .quote { border-left: 3px solid var(--gold); background: #FBF6E8; padding: 8px 12px; margin: 0 0 14px; font-size: 13px; }
  .dv-page .quote .lbl { display: block; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 3px; }
  .dv-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.65; color: var(--ink-2); }
  .dv-text mark { background: rgba(179, 154, 87, 0.22); color: inherit; padding: 1px 2px; border-radius: 2px; }
  .dv-text mark.on { background: #F2E2AE; color: var(--ink); box-shadow: 0 0 0 2px var(--gold); }
  .dv-text mark { cursor: pointer; } .dv-text mark:hover { outline: 1px solid var(--gold); }
  .dv-page + .dv-page, .dv-gap + .dv-page { margin-top: 18px; }
  .dv-gap { text-align: center; color: var(--muted); font-size: 11.5px; padding: 10px 0 2px; }
  .dv-strip b { font-family: var(--mono); } .dv-strip > span, .dv-strip > a { margin-right: 4px; }
  .dv-sec { color: var(--navy); font-size: 12px; } .dv-sec:hover { color: var(--gold-ink); }
  .dv-nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .dv-pg[disabled] { opacity: 0.4; cursor: default; }
  .dv-quote { flex-basis: 100%; font-size: 12.5px; color: var(--ink-2); border-left: 3px solid var(--gold); background: #FBF6E8; padding: 6px 10px; margin-top: 6px; }
  .dv-quote .lbl { display: block; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 2px; }
  body.embed .demobar, body.embed .site-header { display: none; }
  body.embed main { padding: 14px 18px 40px; gap: 24px; }
  body.mode-viewer .demobar, body.mode-viewer .site-header, body.mode-viewer main { display: none; }
  body.mode-viewer { padding-right: 0 !important; }
  body.mode-viewer #doc-viewer { left: 0; width: 100%; border-left: 0; box-shadow: none; }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; padding: 24px 16px 56px; } main > aside { position: static; max-height: none; }
    body.mode-page #doc-viewer, body.mode-page .view-btn, body.mode-page .view-cell, body.mode-page th.view { display: none !important; } body.mode-page.dv-open { padding-right: 0; }
    .header-inner { flex-wrap: wrap; padding: 0 16px; } .header-side { flex: 1 0 100%; padding: 8px 0 10px; }
  }
  @media print { .topics, .tools, #doc-viewer, .site-header, .demobar { display: none !important; } main { display: block; } section.block { break-inside: avoid-page; border: 0; padding: 0; } .view-cell, th.view { display: none; } }
</style>
</head>
<body>
<div class="demobar">Fact dossier · beta · facts extracted from public reports and pending review by a named reviewer · facts and arithmetic only, no opinion · not an offer, solicitation or investment advice</div>
<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="platform.html" aria-label="VanillaBonds — platform demo"><span class="v">VANILLA</span><span class="b">BONDS</span></a>
    <nav class="primary-nav" aria-label="Primary"><ul><li><button type="button" aria-current="page">Fact dossier</button></li></ul></nav>
    <div class="header-side"><label for="co">Company</label><select id="co" class="co" aria-label="Company"></select><a class="back-link" href="platform.html">← Platform</a></div>
  </div>
</header>
<main id="main">
  <div class="title-band" id="band"></div>
  <aside>
    <nav class="topics" id="topics" aria-label="Topics"></nav>
    <div class="tools"><input type="search" id="q" placeholder="Filter facts…" aria-label="Filter facts"><label class="small"><input type="checkbox" id="okonly"> Approved facts only</label></div>
  </aside>
  <div id="content"></div>
</main>
<aside id="doc-viewer" hidden aria-label="Source document">
  <div class="dv-handle" id="dv-handle" title="Drag to resize"></div>
  <div class="dv-bar"><div><p class="dv-kicker">Source document</p><p class="dv-title"><select id="dv-doc" class="dv-doc" aria-label="Document"></select></p><p class="dv-meta" id="dv-meta"></p></div><button type="button" class="dv-close" id="dv-close" aria-label="Close source viewer">×</button></div>
  <div class="dv-strip" id="dv-strip"></div>
  <div class="dv-pages" id="dv-pages" tabindex="-1"></div>
</aside>
<script src="dossier-data/fastned.js"></script>
<script src="dossier-data/katjes.js"></script>
<script>
(function () {
  var ALL = window.DOSSIER_DATA || {}, slugs = Object.keys(ALL);
  if (!slugs.length) { document.getElementById('content').innerHTML = '<p>No dossier data. Run <code>python3 mvp/export_dossier.py</code> and <code>python3 website/seb-mvp/build_dossier.py</code>.</p>'; return; }
  var Q = new URLSearchParams(location.search), slug = Q.get('c'); if (!ALL[slug]) slug = slugs[0];
  // page = on its own; embed = the dossier inside the platform's deal and company screens (documents open in the platform's own panel);
  // viewer = only the document viewer, full size, inside that panel. The two frames talk through the platform with postMessage.
  var MODE = Q.get('viewer') ? 'viewer' : Q.get('embed') ? 'embed' : 'page';
  document.body.classList.add('mode-' + MODE); if (MODE === 'embed') document.body.classList.add('embed');
  function post(m) { if (window.parent !== window) window.parent.postMessage(m, '*'); }
  var D = ALL[slug], $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // facts: [id, field, period, value, unit, text, src, page, quote, status, confidence, quote_found]
  var F = D.facts.map(function (r) { return { id: r[0], field: r[1], period: r[2], value: r[3], unit: r[4], text: r[5], src: r[6], page: r[7], quote: r[8], status: r[9], conf: r[10], found: r[11] }; });
  var BYID = {}; F.forEach(function (f) { BYID[f.id] = f; });
  var DOC = {}; D.docs.forEach(function (d, i) { d.i = i; DOC[d.id] = d; });
  var FIELD = {}; D.blocks.forEach(function (b) { b.fields.forEach(function (f) { f.block = b.id; FIELD[f.id] = f; }); });
  var STATUS = { ok: 'approved', pend: 'pending', rep: 'company statement' };
  function docTitle(d) { return (d.kind || 'document') + (d.period ? ' ' + d.period : '') + (d.date ? ' · ' + d.date : ''); }
  function pkey(p) { var m = /^(FY|H1)-?(\d{4})(E?)$/.exec(p || ''); return m ? [+m[2], m[1] === 'H1' ? 1 : (m[3] ? 2 : 0)] : [9999, 3]; }
  function pcmp(a, b) { var x = pkey(a), y = pkey(b); return x[0] - y[0] || x[1] - y[1] || (a < b ? -1 : a > b ? 1 : 0); }
  function latest(fs) { return fs.slice().sort(function (a, b) { return (DOC[a.src].i - DOC[b.src].i) || ((a.conf || 0) - (b.conf || 0)); })[fs.length - 1]; }
  function fmt(v, unit) {
    if (v == null || v === '') return '<span class="muted">–</span>';
    if (typeof v !== 'number') return esc(v);
    var s = Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1);
    return unit && unit !== 'EUR m' ? s + ' ' + esc(unit) : s;
  }
  function chip(st) { return '<span class="chip ' + st + '">' + (STATUS[st] || st) + '</span>'; }
  function srcText(f) { return f.page ? f.src + ' p.' + f.page : f.src; }
  function viewBtn(f) { return f.page && D.pages[f.src] && D.pages[f.src][f.page] ? '<button type="button" class="view-btn" data-view="' + f.id + '" aria-pressed="false" aria-controls="doc-viewer" aria-label="View source of ' + esc(f.id) + '">View</button>' : '<span class="muted small">no page</span>'; }

  // ---------- charts: the platform's bar chart, by period ----------
  function barChart(title, sub, pts, wide) {
    var W = 520, H = 190, padL = 44, padB = 28, padT = 18, n = pts.length, slot = (W - padL - 8) / n, bw = Math.min(46, slot * 0.62);
    var vals = pts.map(function (p) { return p.v; }).filter(function (v) { return typeof v === 'number'; });
    if (!vals.length) return '';
    var max = Math.max(0, Math.max.apply(null, vals)), min = Math.min(0, Math.min.apply(null, vals)), span = (max - min) || 1;
    var step = niceStep(span / 4), top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;
    function y(v) { return padT + (top - v) / (top - bot || 1) * (H - padT - padB); }
    var grid = '';

        var vp = p1.getViewport({ scale: 1 }); DV.p1 = { w: vp.width, h: vp.height };
        DV.scale = fitScale() * DV.zoom; var w = Math.round(vp.width * DV.scale), h = Math.round(vp.height * DV.scale), html = '';
        for (var n = 1; n <= pdf.numPages; n++) html += '<div class="pdfpage" id="dv-p-' + n + '" data-page="' + n + '" style="width:' + Math.round(w) + 'px;height:' + h + 'px"><span class="pn">' + n + '</span></div>';
        pages.innerHTML = html;
        $('#dv-meta').textContent = docTitle(d) + ' · the original, ' + pdf.numPages + ' pages · ' + pagesOf(src).length + ' pages carry extracted facts, highlighted on the page';
        DV.io = new IntersectionObserver(function (es) { es.forEach(function (e) { var n = +e.target.getAttribute('data-page'); if (e.isIntersecting) renderPage(n); else releasePage(n); }); }, { root: pages, rootMargin: '900px 0px' });
        Array.prototype.forEach.call(pages.querySelectorAll('.pdfpage'), function (el) { DV.io.observe(el); });
        return pdf;
      });
    });
  }
  function renderPage(n) {
    var st = DV.pages[n]; if (st) return st.promise;
    var el = document.getElementById('dv-p-' + n), pdf = DV.pdf, src = DV.src; if (!el || !pdf) return Promise.resolve();
    st = DV.pages[n] = { done: false };
    st.promise = pdf.getPage(n).then(function (page) {
      if (DV.pdf !== pdf || DV.pages[n] !== st) return;
      var vp = page.getViewport({ scale: DV.scale }), dpr = window.devicePixelRatio || 1, v1 = page.getViewport({ scale: 1 });
      DV.dims[n] = { w: v1.width, h: v1.height };
      el.style.width = Math.round(vp.width) + 'px'; el.style.height = Math.round(vp.height) + 'px'; el.style.setProperty('--scale-factor', DV.scale);
      var c = document.createElement('canvas'); c.width = Math.round(vp.width * dpr); c.height = Math.round(vp.height * dpr); el.appendChild(c);
      var tl = document.createElement('div'); tl.className = 'textLayer'; el.appendChild(tl);
      return page.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise
        .then(function () { return page.getTextContent(); })
        .then(function (tc) { var divs = []; return pdfjsLib.renderTextLayer({ textContentSource: tc, container: tl, viewport: vp, textDivs: divs }).promise.then(function () { markPdf(src, n, tc, divs); }); })
        .then(function () { st.done = true; });
    });
    return st.promise;
  }
  function releasePage(n) { var st = DV.pages[n]; if (!st || !st.done) return; var el = document.getElementById('dv-p-' + n); if (el) el.innerHTML = '<span class="pn">' + n + '</span>'; delete DV.pages[n]; }
  // the facts read from this page, found in the text layer and marked span by span
  function markPdf(src, n, tc, divs) {
    var joined = '', spans = [];
    tc.items.forEach(function (it, i) { spans.push({ s: joined.length, e: joined.length + (it.str || '').length, i: i }); joined += (it.str || '') + (it.hasEOL ? '\n' : ' '); });
    factsOn(src, n).forEach(function (f) {
      var m = qre(f.quote).exec(joined); if (!m) return;
      var a = m.index, b = m.index + m[0].length;
      spans.forEach(function (sp) {
        if (!(sp.e > a && sp.s < b) || !divs[sp.i] || !(it = tc.items[sp.i]).str.trim()) return;
        var dv = divs[sp.i], ids = (dv.getAttribute('data-f') || '').split(' ').filter(Boolean); if (ids.indexOf(f.id) < 0) ids.push(f.id);
        dv.classList.add('hl'); dv.setAttribute('data-f', ids.join(' ')); dv.title = tip(ids); if (f.id === DV.active) dv.classList.add('on');
      });
    });
    var it;
  }
  function highlightMain(id, toMain) {
    Array.prototype.forEach.call(document.querySelectorAll('.view-btn[aria-pressed="true"], .cell-btn.on, tr.fact-on'), function (x) { x.classList.remove('on', 'fact-on'); if (x.hasAttribute('aria-pressed')) x.setAttribute('aria-pressed', 'false'); });
    var btn = document.querySelector('.view-btn[data-view="' + id + '"]'), cb = document.querySelector('.cell-btn[data-view="' + id + '"]'), row = document.getElementById('row-' + id);
    if (btn) btn.setAttribute('aria-pressed', 'true'); if (cb) cb.classList.add('on'); if (row) row.classList.add('fact-on');
    if (toMain) { var t = row || cb, det = t && t.closest('details'); if (det && !det.open) det.open = true; if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.pageYOffset - Math.max(16, (window.innerHeight - t.offsetHeight) / 2) }); }
  }
  function showFact(id, toMain) {
    var f = BYID[id]; if (!f || POS[id] == null) return;
    if (MODE === 'embed') { highlightMain(id, toMain); post({ type: 'dossier-view', slug: slug, id: id }); return; }
    var d = DOC[f.src], pages = $('#dv-pages');
    DV.active = id; $('#doc-viewer').hidden = false; document.body.classList.add('dv-open'); $('#dv-doc').value = f.src;
    var usePdf = !DV.textMode && !!d.pdf, ready;
    if (DV.src === f.src && (usePdf ? DV.pdf || DV.task : true)) ready = DV.task && !DV.pdf ? DV.task.promise : Promise.resolve();
    else if (usePdf) ready = openPdf(f.src);
    else { openText(f.src); ready = Promise.resolve(); }
    var b = BLOCK_OF[f.field], i = POS[id];
    $('#dv-strip').innerHTML = '<span class="lbl">Item</span><b>' + esc(id) + '</b><span>' + esc(label(f)) + (f.period ? ' · ' + esc(f.period) : '') + '</span><span class="dv-pg" aria-current="true">page ' + f.page + '</span>' +
      '<a class="dv-sec" href="#row-' + id + '" data-jump="' + id + '">' + esc(b.title) + ' ↗</a>' +
      '<span class="dv-nav"><span class="dv-zoom"><button type="button" class="dv-pg" data-zoom="-1" aria-label="Zoom out">−</button><button type="button" class="dv-pg" data-zoom="0" id="dv-zoomlabel" title="Fit to width">' + Math.round(DV.zoom * 100) + '%</button><button type="button" class="dv-pg" data-zoom="1" aria-label="Zoom in">+</button></span>' +
      '<button type="button" class="dv-pg" data-step="-1"' + (i === 0 ? ' disabled' : '') + '>‹ Previous</button><span class="muted">' + (i + 1) + ' of ' + ORDERED.length + '</span><button type="button" class="dv-pg" data-step="1"' + (i === ORDERED.length - 1 ? ' disabled' : '') + '>Next ›</button></span>' +
      '<div class="dv-quote"><span class="lbl">' + (f.found ? 'Quote as extracted' : 'Quote as extracted · not found verbatim on the page text') + '</span>' + esc(f.quote || f.text) + '</div>';
    if (MODE === 'viewer') post({ type: toMain ? 'dossier-jump' : 'dossier-active', slug: slug, id: id }); else highlightMain(id, toMain);
    ready.then(function () {
      if (DV.src !== f.src || DV.active !== id) return;
      Array.prototype.forEach.call(pages.querySelectorAll('.on'), function (m) { m.classList.remove('on'); });
      var pg = document.getElementById('dv-p-' + f.page); if (!pg) return;
      if (DV.pdf) {
        scrollPagesTo(pg, false);
        renderPage(f.page).then(function () {
          if (DV.active !== id) return;
          var hits = pg.querySelectorAll('.hl[data-f~="' + id + '"]');
          Array.prototype.forEach.call(hits, function (x) { x.classList.add('on'); });
          var go = function () { if (DV.active !== id) return; if (hits.length) scrollPagesTo(hits[0], true); else scrollPagesTo(pg, false); };
          go(); requestAnimationFrame(go);
        });
      } else {
        var mk = pages.querySelector('mark[data-f~="' + id + '"]');
        if (mk) { mk.classList.add('on'); scrollPagesTo(mk, true); } else scrollPagesTo(pg, false);
      }
    }).catch(function () { if (!DV.textMode) { DV.textMode = true; DV.src = null; showFact(id, false); } });   // no PDF to be had: the page text
  }
  function step(n) { var i = POS[DV.active]; if (i == null) return; var j = i + n; if (j >= 0 && j < ORDERED.length) showFact(ORDERED[j], true); }
  function openDocument(src) { var first = ORDERED.filter(function (id) { return BYID[id].src === src; })[0]; if (first) showFact(first, true); }
  $('#dv-doc').innerHTML = D.docs.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.id + ' · ' + docTitle(x) + ' · ' + x.file) + '</option>'; }).join('');
  $('#dv-doc').addEventListener('change', function () { openDocument(this.value); });
  // the panel's width: a handle on its left edge (on the page itself; inside the platform the platform's panel has the handle), remembered per browser
  function setWidth(px) { px = Math.max(360, Math.min(window.innerWidth * 0.9, px)); document.documentElement.style.setProperty('--dv-w', px + 'px'); }
  if (MODE === 'page') (function () {
    var drag = false, h = $('#dv-handle');
    try { var w = localStorage.getItem('vb-dv-w'); if (w) document.documentElement.style.setProperty('--dv-w', w); } catch (x) { /* storage blocked */ }
    h.addEventListener('mousedown', function (e) { drag = true; document.body.classList.add('dv-resizing'); e.preventDefault(); });
    window.addEventListener('mousemove', function (e) { if (drag) setWidth(window.innerWidth - e.clientX); });
    window.addEventListener('mouseup', function () { if (!drag) return; drag = false; document.body.classList.remove('dv-resizing'); try { localStorage.setItem('vb-dv-w', getComputedStyle($('#doc-viewer')).width); } catch (x) { /* storage blocked */ } relayout(); });
  })();
  var relayoutTimer = null; window.addEventListener('resize', function () { clearTimeout(relayoutTimer); relayoutTimer = setTimeout(relayout, 150); });
  function closeViewer() { if (MODE === 'viewer') { post({ type: 'dossier-close', slug: slug }); return; } $('#doc-viewer').hidden = true; document.body.classList.remove('dv-open'); Array.prototype.forEach.call(document.querySelectorAll('.view-btn[aria-pressed="true"]'), function (b) { b.setAttribute('aria-pressed', 'false'); }); }

  if (MODE !== 'viewer') render();
  window.addEventListener('message', function (e) {
    var m = e.data || {}; if (typeof m.type !== 'string' || (m.slug && m.slug !== slug)) return;
    if (MODE === 'viewer' && m.type === 'show') showFact(m.id, false);
    if (MODE === 'viewer' && m.type === 'relayout') relayout();
    if (MODE === 'embed' && (m.type === 'dossier-active' || m.type === 'dossier-jump')) highlightMain(m.id, m.type === 'dossier-jump');
  });
  if (MODE === 'viewer') { post({ type: 'dossier-ready', slug: slug }); if (Q.get('item')) showFact(Q.get('item'), false); }
  document.addEventListener('click', function (e) {
    var v = e.target.closest('[data-view]'); if (v) { showFact(v.getAttribute('data-view'), false); return; }
    var m = e.target.closest('.dv-text mark, .textLayer .hl'); if (m) { showFact(m.getAttribute('data-f').split(' ')[0], true); return; }
    var st = e.target.closest('[data-step]'); if (st) { step(+st.getAttribute('data-step')); return; }
    var z = e.target.closest('[data-zoom]'); if (z) { var zz = +z.getAttribute('data-zoom'); setZoom(zz === 0 ? 1 : zz > 0 ? DV.zoom * 1.25 : DV.zoom / 1.25); return; }
    var j = e.target.closest('.dv-sec'); if (j) { e.preventDefault(); showFact(j.getAttribute('data-jump'), true); return; }
    if (e.target.closest('#dv-close')) closeViewer();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('.bar-group[data-view]')) { showFact(e.target.getAttribute('data-view'), false); return; }
    if ($('#doc-viewer').hidden || /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
  });
  if (MODE !== 'viewer') { $('#q').addEventListener('input', applyFilter); $('#okonly').addEventListener('change', applyFilter); }
})();
</script>
